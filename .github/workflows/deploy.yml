name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest

    # Tes integrasi berjalan terhadap Postgres sungguhan, bukan mock - itulah
    # yang membuatnya menangkap bug constraint, paginasi, dan transaksi.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_user -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # npm ci penuh (bukan --omit=dev): jest dan supertest ada di devDependencies
      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run tests
        run: cd server && npm test
        env:
          TEST_DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/crm_test
          JWT_SECRET: ci-jwt-secret
          SESSION_SECRET: ci-session-secret

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build frontend
        run: cd client && npx vite build

      - name: Install server dependencies (production)
        run: cd server && npm ci --omit=dev

      - name: Verify build
        run: |
          test -f client/dist/index.html
          echo "✅ Frontend build verified"
          test -f server/index.js
          echo "✅ Server entry verified"
