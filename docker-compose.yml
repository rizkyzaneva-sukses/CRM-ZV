version: "3.8"

services:
  app:
    build:
      context: .
      args:
        # Dibaca saat `vite build`; tanpa ini client memakai placeholder
        # 'dummy_client_id_for_now' dan tombol Google tidak berfungsi.
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://crm_user:crm_password@db:5432/crm_db
      - PORT=3000
      - NODE_ENV=production
      # Tanpa nilai default: secret wajib disuplai dari environment/.env,
      # kalau kosong server sengaja gagal start di NODE_ENV=production.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET wajib di-set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET wajib di-set}
      # Kosong = fitur Login Google mati; server tetap jalan dengan login email/password.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=crm_password
      - POSTGRES_DB=crm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
